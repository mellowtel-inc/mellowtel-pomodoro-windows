<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pomodoro Timer for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111935"/>
      <stop offset="100%" stop-color="#1B2552"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FFB84A"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D3D"/>
      <stop offset="100%" stop-color="#E94B3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#2A3566" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <circle cx="960" cy="200" r="260" fill="url(#glow)"/>

  <g transform="translate(80, 150)">
    <g transform="translate(0, -20)">
      <!-- Tomato timer mark -->
      <circle cx="48" cy="58" r="40" fill="url(#tomato)"/>
      <path d="M 48 18 Q 38 8 30 14 Q 42 16 48 22 Q 54 16 66 14 Q 58 8 48 18 Z" fill="#3FB36F"/>
      <circle cx="48" cy="58" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
      <line x1="48" y1="58" x2="48" y2="38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="58" x2="62" y2="58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="48" cy="58" r="2.5" fill="#FFFFFF"/>
    </g>

    <text x="130" y="38" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">
      Pomodoro Timer
    </text>
    <text x="132" y="78" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="url(#accent)" letter-spacing="4">
      POWERED BY MELLOWTEL
    </text>
  </g>

  <g transform="translate(80, 300)">
    <text x="0" y="0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#C9D2F2">
      Focus, break, repeat.
    </text>
    <text x="0" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8892C7" letter-spacing="1">
      Minimal · Open-Source · Distraction-free
    </text>
  </g>

  <!-- Pomodoro dial on right, vertically centred with text block -->
  <g transform="translate(980, 200)" opacity="0.95">
    <!-- Outer subtle halo ring -->
    <circle cx="0" cy="0" r="94" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.25"/>
    <!-- Main dial ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.45"/>
    <!-- Progress arc: 3/4 sweep, top → clockwise → left -->
    <path d="M 0 -82 A 82 82 0 1 1 -82 0" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <!-- Major tick marks (12/3/6/9) -->
    <g stroke="#E9EEFB" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-74" x2="0" y2="-64"/>
      <line x1="74" y1="0" x2="64" y2="0"/>
      <line x1="0" y1="74" x2="0" y2="64"/>
      <line x1="-74" y1="0" x2="-64" y2="0"/>
    </g>
    <!-- Minor tick marks (every 30°) -->
    <g stroke="#8892C7" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
      <line transform="rotate(30)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(60)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(120)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(150)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(210)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(240)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(300)" x1="0" y1="-74" x2="0" y2="-68"/>
      <line transform="rotate(330)" x1="0" y1="-74" x2="0" y2="-68"/>
    </g>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="0" y2="-52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Hour hand (pointing ~5 o'clock) -->
    <line x1="0" y1="0" x2="22" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Center pivot -->
    <circle cx="0" cy="0" r="6" fill="#FF6B4A"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
</svg>
